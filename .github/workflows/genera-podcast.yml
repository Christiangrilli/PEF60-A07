name: Genera podcast dai manuali

on:
  push:
    paths:
      - '05_MANUALE CONCORSO/**/*.md'
      - '.github/workflows/genera-podcast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg sox espeak-ng

      - name: Download Markdown Podcast Narrator
        run: |
          git clone --depth 1 https://github.com/Navaneethsen/markdown-podcast-narrator.git /tmp/markdown-podcast-narrator
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/markdown-podcast-narrator/requirements.txt

      - name: Configure Italian narration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/markdown-podcast-narrator/narrator.py')
          s = p.read_text()
          s = s.replace('self.language = "English"', 'self.language = "Italian"')
          s = s.replace('self.speaker = "Ryan"', 'self.speaker = "Ryan"')
          p.write_text(s)
          PY

      - name: Generate WAV and MP3 files
        run: |
          mkdir -p '05_MANUALE CONCORSO/audio'
          find '05_MANUALE CONCORSO' -maxdepth 1 -type f -name '*.md' -print0 | while IFS= read -r -d '' file; do
            base="$(basename "$file" .md)"
            safe="$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9àèéìòù_-]/_/g' | tr -s '_')"
            echo "=== Generating: $file ==="
            python /tmp/markdown-podcast-narrator/main.py "$file" \
              --engine qwen \
              --model Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice \
              --rate 0.95 \
              --speaker Ryan \
              --instruct 'Voce narrante italiana, maschile, chiara, calma e professionale. Pronuncia correttamente nomi e termini italiani. Ritmo naturale da podcast didattico, senza enfasi eccessiva.' \
              -o "/tmp/${safe}.wav"
            ffmpeg -y -i "/tmp/${safe}.wav" -codec:a libmp3lame -b:a 48k "05_MANUALE CONCORSO/audio/${safe}.mp3"
            rm -f "/tmp/${safe}.wav"
          done

      - name: Commit audio files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '05_MANUALE CONCORSO/audio/'
          if git diff --cached --quiet; then
            echo 'No audio changes to commit.'
            exit 0
          fi
          git commit -m 'Aggiunge podcast audio ai manuali concorso'
          git push
